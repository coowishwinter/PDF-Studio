services:
  pdf-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-studio-app
    ports:
      - "8080:80"
    restart: always
    environment:
      - NODE_ENV=production
    volumes:
      - ./deploy/nginx-nas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pdf-feedback

  pdf-feedback:
    build:
      context: .
      dockerfile: Dockerfile.feedback
    container_name: pdf-studio-feedback
    restart: always
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - FEEDBACK_ADMIN_TOKEN=${FEEDBACK_ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data
